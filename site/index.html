<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="color-scheme" content="light" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://raw.githubusercontent.com; img-src 'self' blob: data: https://raw.githubusercontent.com; media-src 'self' blob: https://raw.githubusercontent.com; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta
      name="description"
      content="Games, tools, music, and experiments. Updates from whatever I'm working on at Small Loop Works."
    />
    <link rel="canonical" href="https://rareskey.github.io/devlog/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Small Loop Works" />
    <meta property="og:title" content="Small Loop Works: devlog" />

      property="og:description"
      content="Games, tools, music, and experiments. Updates from whatever I'm working on."
    />
    <meta property="og:url" content="https://rareskey.github.io/devlog/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Small Loop Works: devlog" />
    <meta
      name="twitter:description"
      content="Games, tools, music, and experiments. Updates from whatever I'm working on."
    />
    <link rel="icon" href="./favicon.ico?v=20261017-2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20261017-2" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon-512.png?v=20261017-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20261017-2" />
    <link rel="stylesheet" href="./styles.css?v=20261018-3" />
    <title>Small Loop Works: devlog</title>
  </head>
  <body>
    <div class="showcase-background" id="showcase-background" aria-hidden="true">
      <picture>
        <source media="(max-aspect-ratio: 6/5)" srcset="./showcase/portrait.webp?v=20261018-2" />
        <img src="./showcase/landscape.webp?v=20261018-2" alt="" width="1024" height="768" decoding="async" fetchpriority="low" />
      </picture>
    </div>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Small Loop Works home">
        <img class="brand-mark" src="./favicon-512.png?v=20261017-2" width="38" height="38" alt="" />
        <span>Small Loop Works</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="#devlog">Devlog</a>
        <a href="https://github.com/RaresKeY/devlog">GitHub</a>
        <button class="showcase-toggle" id="showcase-toggle" type="button" aria-label="Pause background" aria-pressed="true" title="Pause background" hidden>
          <svg class="showcase-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
          <svg class="showcase-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m8 5 11 7-11 7z" /></svg>
        </button>
      </nav>
    </header>

    <main id="top">
      <div class="hero-viewport">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <h1 id="hero-title">Stuff I'm<br />working on.</h1>
            <p class="hero-intro">
              Games, tools, music, and experiments. Updates from whatever I'm working on.
            </p>
            <div class="hero-actions">
              <a class="button primary" href="#devlog">Latest updates</a>
              <a class="button quiet" href="https://smallloopworks.itch.io/">Games on itch.io ↗</a>
            </div>
          </div>
          <figure class="hero-art">
            <img
              src="./hero.webp?v=20261017-2"
              alt="A little purple game-making machine with a robot on its loop track"
              width="900"
              height="900"
            />
          </figure>
        </section>
      </div>

      <section class="feed" id="devlog" aria-labelledby="feed-title">
        <div class="feed-tools">
        <div class="section-heading">
          <div>
            <h2 id="feed-title">Latest updates</h2>
          </div>
        </div>

        <div class="feed-controls" aria-label="Filter updates">
          <label class="search-control">
            <span>Search</span>
            <input id="search" type="search" placeholder="Notes, projects, or tags" />
          </label>
          <label class="project-control">
            <span>Project</span>
            <select id="project-filter">
              <option value="all">All projects</option>
            </select>
          </label>
        </div>

        <div class="status-row" id="status-filters" role="group" aria-label="Filter by status"></div>
        <p class="feed-notice" id="feed-notice" role="status" aria-live="polite"></p>
        <div class="feed-summary"><strong id="visible-count">0</strong> updates shown</div>
        </div>
        <div class="updates-grid" id="updates" aria-busy="true"></div>

        <noscript>
          <div class="feed-state">JavaScript is required to read the public JSON feed.</div>
        </noscript>
      </section>
    </main>

    <footer class="site-footer">
      <img class="brand-mark" src="./favicon-512.png?v=20261017-2" width="38" height="38" alt="" />
      <p><strong>Small Loop Works</strong><br />Games, tools, and experiments.</p>
      <a href="https://github.com/RaresKeY/devlog">GitHub ↗</a>
    </footer>

    <dialog class="lightbox" id="lightbox">
      <button class="lightbox-close" type="button" aria-label="Close image">×</button>
      <img alt="" />
      <p></p>
    </dialog>

    <aside class="music-player" id="music-player" aria-label="Music player" hidden>
      <div class="music-bar">
        <div class="music-row">
          <button class="music-now" id="music-expand" type="button" aria-expanded="false" aria-controls="music-panel" title="Open music library">
            <img class="music-cover" id="music-cover" src="./favicon-512.png?v=20261017-2" width="44" height="44" alt="" decoding="async" />
            <span class="music-info">
              <span class="music-title" id="music-title"><span id="music-title-text">Music</span></span>
              <span class="music-subtitle" id="music-subtitle">Choose a track</span>
            </span>
          </button>
          <div class="music-transport" role="group" aria-label="Playback controls">
            <button class="music-skip" id="music-previous" type="button" aria-label="Previous track" title="Previous track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5" /></svg>
            </button>
            <button class="music-toggle" id="music-toggle" type="button" aria-label="Play music" title="Play music">
              <svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z" /></svg>
              <svg class="pause-symbol" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
            </button>
            <button class="music-skip" id="music-next" type="button" aria-label="Next track" title="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7 5 5-5 5" /></svg>
            </button>
          </div>
        </div>
        <div class="music-progress">
          <span id="music-elapsed">0:00</span>
          <input id="music-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek in track" disabled />
          <span id="music-duration">0:00</span>
        </div>
      </div>
      <div class="music-panel" id="music-panel" hidden>
        <div class="music-panel-heading">
          <h2>Music</h2>
          <button class="music-collapse" id="music-collapse" type="button" aria-label="Collapse music player" title="Collapse music player">×</button>
        </div>
        <div class="music-settings">
          <label for="music-volume">Volume</label>
          <input id="music-volume" type="range" min="0" max="1" value="0.6" step="0.01" />
        </div>
        <p class="music-message" id="music-message" role="status" aria-live="polite"></p>
        <ol class="music-tracks" id="music-tracks" aria-label="Music tracks"></ol>
      </div>
      <audio id="music-audio" preload="none"></audio>
    </aside>

    <script type="module" src="./app.js?v=20261018-2"></script>
    <script type="module" src="./music.js?v=20261018-2"></script>
    <script type="module" src="./showcase.js?v=20261018-2"></script>
  </body>
</html>
