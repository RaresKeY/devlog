name: Validate public feed

on:
  push:
    branches:
      - main
    paths:
      - feed/**
  pull_request:
    paths:
      - feed/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify public source
        run: python3 scripts/check_public_bundle.py
